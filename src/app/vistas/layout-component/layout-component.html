<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEST</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="container mt-3">
        <div class="row align-items-center mb-4">
            <h1 class="mb-4 col">Polideportivo San Sebastian</h1>
            <div class="col-auto">
                <a routerLink="/login" class="btn btn-primary col">Regresar</a>
            </div>
        </div>


        <div class="d-flex flex-wrap gap-4 justify-content-center text-center">

            <div class="card col-4 justify-content-center ">
                <div class="card-body">
                    <h5 class="card-title">Usuarios</h5>
                    <div class="card-texto">
                        <p class="card-text">Gestión de administradores y trabajadores</p>
                    </div>
                    <a routerLink="/usuario" class="btn btn-primary w-100">Ir a Usuarios</a>
                </div>
            </div>


             <div class="card col-4 justify-content-center">
                <div class="card-body">
                    <h5 class="card-title text-center">Clientes</h5>
                    <div class="card-texto">
                        <p class="card-text">Gestionar clientes</p>
                    </div>
                    <a routerLink="/cliente" class="btn btn-primary w-100">Ir a Clientes</a>
                </div>
            </div>

            <div class="card col-4 justify-content-center">
                <div class="card-body">
                    <h5 class="card-title">Reservas</h5>
                    <div class="card-texto">
                        <p class="card-text">Gestionar Reservas</p>
                    </div>
                    <a routerLink="/reserva" class="btn btn-primary w-100">Ir a Reservas</a>
                </div>
            </div>

           
            <div class="card col-4 justify-content-center">
                <div class="card-body">
                    <h5 class="card-title text-center">Pagos</h5>
                    <div class="card-texto">
                        <p class="card-text">Gestionar pagos de las reservas</p>
                    </div>
                    <a routerLink="/pago" class="btn btn-primary w-100">Ir a Pagos</a>
                </div>
            </div>
 
        </div> 
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
