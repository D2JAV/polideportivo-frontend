<form class="example-container" [formGroup]="form" (submit)="persist()">
  <div [hidden]="true">
    <mat-form-field>
      <input matInput placeholder="Cliente ID" formControlName="idCliente" />
    </mat-form-field>
  </div>

  <mat-form-field>
    <input matInput placeholder="Nombre" formControlName="nombre" />
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Apellido" formControlName="apellido" />
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="DNI" formControlName="dni" />
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Teléfono" formControlName="telefono" />
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Correo" formControlName="correo" />
  </mat-form-field>

  <mat-form-field>
    <input matInput placeholder="Fecha de Registro" formControlName="fechaRegistro" type="date"/>
  </mat-form-field>

  <button mat-button type="submit">
    <mat-icon>done</mat-icon>
    <span>Guardar</span>
  </button>

  <button mat-button routerLink="/pages/cliente" type="button">
    <mat-icon>cancel</mat-icon>
    <span>Cancelar</span>
  </button>
</form>
