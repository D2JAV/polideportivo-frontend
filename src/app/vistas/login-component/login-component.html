 
<div class="container d-flex align-items-center justify-content-center vh-100">


    <div class="login d-flex flex-column p-4 border">
        <h1 class="titulo">Polideportivo San Sebastian</h1>

        <form class=" d-flex flex-column gap-3" autocomplete="off">

            <label class="label-form">Correo</label>
            <input type="text" class="form-control" placeholder="correo@xample.com..." name="email" [(ngModel)]="email"
                required>

            <label class="label-form">Contraseña</label>
            <input type="password" class="form-control" placeholder="Ingrese su contraseña..." name="password"
                [(ngModel)]="password" required>

            <div class="msg-error">
                <label class="text-danger text-center">
                    {{ errorMessage }}
                </label>
            </div>

            <button (click)="iniciarSesion()" class="btn btn-primary w-100">Iniciar Sesión</button>

        </form>
    </div>
</div>
